name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so the CUDA
# MSM test (TestMSMGPU) skips itself in CI and the kernels are never run. This
# builds the project and runs the tests on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements real-GPU validation
# and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "test_vectors/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: gpu-sim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # 90-virtual embeds PTX only, which is what the simulator runs, and the
      # simulator needs a shared CUDA runtime.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared

      - name: Build
        run: cmake --build build -j3

      # The seven suites without the "gpu" label run on the host only.
      - name: Host suites
        run: vgpu run ctest --test-dir build --output-on-failure -LE gpu

      # TestMSMGPU returns 77 when it finds no CUDA device and ctest counts
      # that as a skip, not a failure. Here a skip is an error: the log must
      # not contain the skip message and must contain a GPU/CPU comparison.
      - name: GPU MSM test
        run: |
          vgpu run ctest --test-dir build -L gpu -V | tee "$RUNNER_TEMP/gpu-test.log"
          if grep -Eq 'SKIP: no CUDA device|\*\*\*Skipped' "$RUNNER_TEMP/gpu-test.log"; then
            echo "::error::TestMSMGPU was skipped instead of run"
            exit 1
          fi
          grep -q 'PASS: GPU MSM matches CPU' "$RUNNER_TEMP/gpu-test.log"
